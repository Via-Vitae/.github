name: CI

# Lightweight CI for the .github org-defaults repository.
# Validates YAML syntax and ensures reusable workflows parse correctly.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yaml-lint:
    name: YAML syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: |
          set -euo pipefail
          yamllint -d '{extends: default, rules: {line-length: disable, truthy: disable, comments-indentation: disable}}' \
            .github/workflows/ profile/ *.md 2>/dev/null || true
          # Validate all workflow YAML parses
          python3 -c "
          import yaml, glob, sys
          ok = True
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  yaml.safe_load(open(f))
                  print(f'  ✓ {f}')
              except Exception as e:
                  print(f'  ✗ {f}: {e}')
                  ok = False
          if not ok: sys.exit(1)
          print('All workflow YAML files parse successfully.')
          "

  governance:
    name: Governance files present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify org-level files
        run: |
          set -euo pipefail
          required=(
            "profile/README.md"
            "CODE_OF_CONDUCT.md"
            "CONTRIBUTING.md"
            "SECURITY.md"
            "SUPPORT.md"
            ".github/CODEOWNERS"
            ".github/PULL_REQUEST_TEMPLATE.md"
            ".github/ISSUE_TEMPLATE/bug_report.yml"
            ".github/ISSUE_TEMPLATE/feature_request.yml"
          )
          missing=0
          for f in "${required[@]}"; do
            if [ -f "$f" ]; then
              echo "  ✓ $f"
            else
              echo "  ✗ $f MISSING"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::$missing required org-level file(s) missing."
            exit 1
          fi

  ci-status:
    name: CI status
    needs: [yaml-lint, governance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate required gates
        run: |
          set -euo pipefail
          # The verdict is computed by the Actions expression engine from the
          # needs context and passed in as GATE_BAD. Never decide a gate by
          # grepping toJSON(needs): the serialisation is not contractual, and a
          # space after the colon makes the old matcher count 0 failures and
          # report success over failed jobs (viavitae-web PR #32).
          results='${{ toJSON(needs) }}'
          printf '%s' "$results" | grep -o '"[a-z-]*":\{"result":"[a-z]*"' || true
          if [[ "${{ env.GATE_BAD }}" == "true" ]]; then
            echo "::error::A required CI gate failed or was cancelled."
            exit 1
          fi
          echo "All CI gates passed or were legitimately skipped."
        env:
          GATE_BAD: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
